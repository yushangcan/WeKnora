name: Evaluation Reproducibility

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  WEKNORA_BASE_URL: ${{ vars.WEKNORA_BASE_URL }}
  WEKNORA_TENANT_ID: ${{ vars.WEKNORA_TENANT_ID }}
  WEKNORA_API_KEY: ${{ secrets.WEKNORA_API_KEY }}
  EVALUATION_DATASET_ID: ${{ vars.EVALUATION_DATASET_ID }}
  EVALUATION_KNOWLEDGE_BASE_ID: ${{ vars.EVALUATION_KNOWLEDGE_BASE_ID }}
  EVALUATION_CHAT_MODEL_ID: ${{ vars.EVALUATION_CHAT_MODEL_ID }}
  EVALUATION_RERANK_MODEL_ID: ${{ vars.EVALUATION_RERANK_MODEL_ID }}
  EVALUATION_POLL_INTERVAL: "5s"
  EVALUATION_TIMEOUT: "30m"
  EVALUATION_REPORT_PATH: "tmp/evaluation-report.json"
  EVALUATION_BASELINE_RUN_ID: ${{ vars.EVALUATION_BASELINE_RUN_ID }}
  EVALUATION_COMPARISON_RUN_IDS: ${{ vars.EVALUATION_COMPARISON_RUN_IDS }}
  EVALUATION_COMPARISON_REPORT_PATH: "tmp/evaluation-comparison.json"

jobs:
  reproducibility:
    name: Scheduled evaluation reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check evaluation configuration
        id: preflight
        shell: bash
        run: |
          set -u
          missing=()
          [[ -n "${WEKNORA_BASE_URL:-}" ]] || missing+=(WEKNORA_BASE_URL)
          [[ -n "${WEKNORA_TENANT_ID:-}" ]] || missing+=(WEKNORA_TENANT_ID)
          [[ -n "${WEKNORA_API_KEY:-}" ]] || missing+=(WEKNORA_API_KEY)
          [[ -n "${EVALUATION_DATASET_ID:-}" ]] || missing+=(EVALUATION_DATASET_ID)
          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'status=skipped\nreason=missing configuration: %s\n' "${missing[*]}" > evaluation-ci-status.txt
            echo "::notice::Evaluation reproducibility skipped; configure the required repository variables and WEKNORA_API_KEY secret."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            printf 'status=ready\ncommit=%s\n' "$GITHUB_SHA" > evaluation-ci-status.txt
          fi

      - name: Run evaluation CLI
        if: steps.preflight.outputs.ready == 'true'
        run: go run ./cmd/evaluation

      - name: Compare against configured baseline
        if: >-
          steps.preflight.outputs.ready == 'true' &&
          env.EVALUATION_BASELINE_RUN_ID != '' &&
          env.EVALUATION_COMPARISON_RUN_IDS != ''
        run: go run ./cmd/evaluation compare

      - name: Record successful execution
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo "status=completed"
            echo "commit=$GITHUB_SHA"
            echo "report=tmp/evaluation-report.json"
            if [[ -f tmp/evaluation-comparison.json ]]; then
              echo "comparison_report=tmp/evaluation-comparison.json"
            fi
          } > evaluation-ci-status.txt

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reproducibility-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            evaluation-ci-status.txt
            tmp/evaluation-report.json
            tmp/evaluation-comparison.json
