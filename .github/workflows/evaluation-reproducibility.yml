name: Evaluation Reproducibility

# Synthetic integration/contract check. Real-provider and cross-commit quality
# measurements still use cmd/evaluation against an explicitly chosen baseline.
on:
  pull_request:
    paths:
      - "cmd/server/**"
      - "cmd/evaluation/**"
      - "internal/**"
      - "config/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "ci/evaluation/**"
      - "docker-compose.evaluation.yml"
      - "scripts/evaluation_ci.sh"
      - ".github/workflows/evaluation-reproducibility.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: evaluation-reproducibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproducibility:
    name: Self-contained evaluation contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Test synthetic provider and evidence guards
        run: python3 -m unittest discover -s ci/evaluation -p 'test_*.py' -v

      - name: Build and exercise the isolated stack
        env:
          EVALUATION_ARTIFACT_DIR: ${{ github.workspace }}/tmp/evaluation-ci
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/evaluation_ci.sh

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-contract-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: tmp/evaluation-ci/
